[project]
name = "big-ai-vision"
version = "0.1.0"
description = "Camera perception and stationary-object evidence for the rover demo"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
  "pillow>=11,<13",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
ml = ["ultralytics>=8.4,<9", "torch>=2.6,<3", "opencv-python>=4.10,<5"]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vision", "vision.cameras", "vision.perception", "vision.classification"]

[tool.setuptools.package-dir]
vision = "."

[tool.setuptools.package-data]
vision = ["web/*.html", "web/*.js", "fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
